<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - Yonghao Wang</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1 class="projects-title">Projects</h1>

  <p>Here are some of the projects I have worked on.</p>

  <section class="chart-section" aria-labelledby="projects-chart-title">
    <h2 id="projects-chart-title">Projects by Year</h2>
    <div class="chart-layout">
      <svg id="projects-bar-plot" role="img" aria-label="Bar chart showing project counts by year"></svg>
      <ul class="chart-legend" aria-label="Project year color legend"></ul>
    </div>
  </section>

  <input
    id="projects-search"
    type="search"
    aria-label="Search projects"
    placeholder="🔍 Search projects…"
  >

  <div class="projects"></div>

  <script src="../global.js" type="module"></script>
  <script src="projects.js" type="module"></script>
</body>
</html>
