name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate loc.csv
        run: npx elocuent -i "{*.html,*.js,*.css,contact/**/*.{html,css,js},lib/**/*.{html,css,js},meta/**/*.{html,css,js},projects/**/*.{html,css,js},resume/**/*.{html,css,js}}" -o meta/loc.csv

      - name: Prepare static site
        run: |
          mkdir _site
          cp -R *.html *.js *.css contact images lib meta projects resume static _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
