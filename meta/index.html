<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('portfolioTheme');
        const legacy = localStorage.getItem('colorScheme');
        const stored = saved === 'light' || saved === 'dark' ? saved : legacy;
        const theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta - Yonghao Wang</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../style.css?v=portfolio-v2-20260520d">
</head>
<body class="meta-page">
  <header class="page-intro">
    <p class="eyebrow">Build telemetry</p>
    <h1>Meta</h1>
    <p>This page summarizes code statistics for this portfolio.</p>
  </header>

  <section aria-labelledby="evolution-title" class="timeline-control">
    <h2 id="evolution-title">Codebase Evolution</h2>
    <label class="time-filter" for="commit-progress">
      <span>Show commits until:</span>
      <input type="range" id="commit-progress" min="0" max="100" value="100">
      <time id="commit-time"></time>
    </label>
  </section>

  <section aria-labelledby="stats-title">
    <h2 id="stats-title">Summary Stats</h2>
    <div id="stats"></div>
  </section>

  <section aria-labelledby="scatterplot-title">
    <h2 id="scatterplot-title">Commits by Time of Day</h2>
    <div id="scrolly-1">
      <div id="scatter-story"></div>
      <div id="scatter-plot">
        <div id="chart"></div>
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </div>
    </div>
  </section>

  <section aria-labelledby="files-title">
    <h2 id="files-title">File Sizes Over Time</h2>
    <div id="scrolly-2">
      <div id="files-story"></div>
      <div id="files-plot">
        <dl id="files"></dl>
      </div>
    </div>
  </section>

  <div id="commit-tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

  <script src="../global.js?v=portfolio-v2-20260520d" type="module"></script>
  <script src="meta.js?v=portfolio-v2-20260520d" type="module"></script>
</body>
</html>
