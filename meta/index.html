<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta - Yonghao Wang</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1>Meta</h1>

  <p>This page summarizes code statistics for this portfolio.</p>

  <section aria-labelledby="stats-title">
    <h2 id="stats-title">Summary Stats</h2>
    <div id="stats"></div>
  </section>

  <section aria-labelledby="scatterplot-title">
    <h2 id="scatterplot-title">Commits by Time of Day</h2>
    <div id="chart"></div>
    <p id="selection-count">No commits selected</p>
    <dl id="language-breakdown" class="stats"></dl>
  </section>

  <div id="commit-tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

  <script src="../global.js" type="module"></script>
  <script src="meta.js" type="module"></script>
</body>
</html>
